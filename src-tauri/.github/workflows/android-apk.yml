name: Build Android APK

on:
  workflow_dispatch:  # permite rodar manualmente pela interface do GitHub
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write  # para criar release com o APK

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          cmdline-tools-version: 'latest'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: .

      - name: Build frontend
        run: yarn build
        working-directory: .
        env:
          NODE_ENV: production

      - name: Initialize Tauri Android (if needed)
        run: |
          cd src-tauri
          if [ ! -d "gen/android" ]; then
            cargo tauri android init
          fi

      - name: Build Android APK
        run: |
          cd src-tauri
          cargo tauri android build --target aarch64-linux-android --target armv7-linux-androideabi --target x86_64-linux-android --target i686-linux-android

      - name: Find APKs
        id: find_apks
        run: |
          cd src-tauri
          find gen/android -name "*.apk" -type f | while read apk; do
            echo "Found: $apk"
          done
          # Universal APK (all architectures)
          UNIVERSAL=$(find gen/android -name "*universal*release*.apk" -o -name "*release*universal*.apk" | head -1)
          if [ -n "$UNIVERSAL" ]; then
            echo "universal_apk=$UNIVERSAL" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: splicedd-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create Release (se for tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true